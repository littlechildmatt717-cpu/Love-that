name: Android Build (Capacitor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Update to match your project's Node version
        cache: 'npm'
        - name: Install Node dependencies run: 
        npm install working-directory: 
        ./frontend # <---.github/workflows/nodeygotya
        - name: Run application run: 
        npm run build working-directory: 
        ./frontend # <---


    # 3. Set up Java Environment (Required for Android Gradle)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' # Required for modern Android/Gradle tools

    # 4. Install npm dependencies
    - name: Install Dependencies
      run: npm ci

    # 5. Build the web assets (Angular, React, Vue, etc.)
    - name: Build Web Application
      run: npm run build

    # 6. Sync web assets and plugins to the Android project
    - name: Capacitor Sync Android
      run: npx cap sync android

    # 7. Grant execute permission for the Gradle Wrapper
    - name: Chmod Gradle Wrapper
      run: chmod +x android/gradlew

    # 8. Build the Android app (Produces debug APK and release AAB)
    - name: Build Android App
      run: |
        cd android
        ./gradlew assembleDebug
        ./gradlew bundleRelease

    # 9. Upload the generated APK and AAB files as build artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build-artifacts
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/bundle/release/app-release.aab
