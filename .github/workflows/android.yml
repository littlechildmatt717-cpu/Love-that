name: Build love that Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      -  .github/workflows/LOCKFILE
      
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_VERSION: '24'
      JAVA_VERSION: '21'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify package lockfile
        run: test -s package-lock.json
         .github/workflows/LOCKFILE

      - name: Build web application
        run: npm run build

      - name: Verify web build output
        run: test -s dist/index.html

      - name: Add Android platform
        run: npx --no-install cap add android

      - name: Sync Capacitor Android project
        run: npx --no-install cap sync android

      - name: Configure camera and microphone permissions
        run: python3 scripts/configure-media-permissions.py .

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          chmod +x android/gradlew

      - name: Configure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create release signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/love-that-release.keystore"
          test -s "$RUNNER_TEMP/love-that-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/love-that-release.keystore" >> "$GITHUB_ENV"

      - name: Configure Gradle release signing
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        run: |
          python3 scripts/configure-android-signing.py android/app/build.gradle

      - name: Build signed Android App Bundle
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Build unsigned Android App Bundle
        if: ${{ env.ANDROID_KEYSTORE_PATH == '' }}
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Build debug APK for device testing
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate Android artifacts
        run: |
          echo "=== AAB Files ==="
          find android/app/build/outputs/bundle -type f -name "*.aab" -print || echo "No AAB files found"

          echo ""
          echo "=== APK Files ==="
          find android/app/build/outputs/apk -type f -name "*.apk" -print || echo "No APK files found"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: love-that-android-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: love-that-android-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- *Repository*: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Branch*: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Commit*: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Node.js*: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- *npm*: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "- *Status*: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
